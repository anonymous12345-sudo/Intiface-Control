start_pattern:
  name: Start pattern
  description: >-
    Runs a single wave or pulse cycle, optionally repeated. Wave-only
    fields (min_speed/max_speed/duration) are ignored for a pulse
    pattern, and pulse-only fields (low_speed/high_speed/low_duration/
    high_duration) are ignored for a wave pattern.
  fields:
    target:
      name: Target
      description: Device slug (e.g. lovense_hush), or "all" for every connected toy.
      required: true
      example: "lovense_hush"
      selector:
        text:
    pattern:
      name: Pattern
      description: Which pattern to run.
      required: true
      selector:
        select:
          options:
            - wave
            - pulse
    repeat:
      name: Repeat
      description: How many times to repeat the single wave/pulse cycle.
      default: 1
      selector:
        number:
          min: 1
          max: 100
    min_speed:
      name: Min speed (wave)
      description: The wave's trough — its speed at the start and end of each cycle.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    max_speed:
      name: Max speed (wave)
      description: The wave's peak — its speed at the midpoint of each cycle.
      default: 50
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    duration:
      name: Duration (wave)
      description: How long one single wave (min → max → min) takes, in seconds.
      default: 3
      selector:
        number:
          min: 0.2
          max: 60
          step: 0.1
          unit_of_measurement: seconds
    low_speed:
      name: Low speed (pulse)
      description: Speed during the low phase of each pulse cycle.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    high_speed:
      name: High speed (pulse)
      description: Speed during the high phase of each pulse cycle.
      default: 80
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    low_duration:
      name: Low duration (pulse)
      description: How long the low phase lasts, in seconds.
      default: 2
      selector:
        number:
          min: 0.2
          max: 60
          step: 0.1
          unit_of_measurement: seconds
    high_duration:
      name: High duration (pulse)
      description: How long the high phase lasts, in seconds.
      default: 2
      selector:
        number:
          min: 0.2
          max: 60
          step: 0.1
          unit_of_measurement: seconds

stop_pattern:
  name: Stop pattern
  description: Stops any running pattern for the given target.
  fields:
    target:
      name: Target
      description: Device slug, or "all" for every connected toy.
      required: true
      example: "lovense_hush"
      selector:
        text:
